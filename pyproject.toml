[project]
name = "django-snapshots"
version = "0.1.0b1"
description = "A generic and pluggable backup and restore management utility for Django."
requires-python = ">=3.8,<4.0"
authors = [
  {name = "Brian Kohan", email = "bckohan@gmail.com"},
]
license = "MIT"
license-files = [ "LICENSE" ]

readme = "README.md"
repository = "https://github.com/bckohan/django-snapshots"
homepage = "https://django-snapshots.readthedocs.io"
keywords = ["django"]
dependencies = [
    "asyncer>=0.0.11",
    "django>=4.2,<6.2",
    # 2.2.x is the last release supporting Python 3.8 (where Django tops out at
    # 4.2); it lacks finalizers, see _compat.py. 2.2.x permits but does not
    # support Django 5.2+, so it is only allowed on 3.8.
    "django-typer>=2.2.2; python_version < '3.9'",
    "django-typer>=3.4.0; python_version >= '3.9'",
    "tqdm>=4.62.0",
    "typing_extensions>=4.0.0",
    "python-dateutil>=2.8.0",
]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Development Status :: 4 - Beta",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",

    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true
conflicts = [
  [
    { group = "dj42" },
    { group = "dj52" },
    { group = "dj61" },
  ],
  [
    { group = "mysqlclient2x" },
    { group = "mysqlclient14" },
  ],
  [
    { group = "psycopg2" },
    { group = "psycopg3" },
  ],
]

# mysqlclient 1.4.3 publishes no wheels, so resolving the dependency groups
# would otherwise build it from source on every platform, which fails where the
# MySQL client headers aren't installed (e.g. macOS and Windows CI runners).
[[tool.uv.dependency-metadata]]
name = "mysqlclient"
version = "1.4.3"
requires-dist = []

[tool.hatch.build.targets.wheel]
packages = ["src/django_snapshots"]

[project.urls]
"Homepage"      = "https://django-snapshots.readthedocs.io"
"Documentation" = "https://django-snapshots.readthedocs.io"
"Repository"    = "https://github.com/bckohan/django-snapshots"
"Issues"        = "https://github.com/bckohan/django-snapshots/issues"
"Changelog"     = "https://django-snapshots.readthedocs.io/en/latest/changelog.html"
"Code_of_Conduct" = "https://github.com/bckohan/django-snapshots/blob/main/CODE_OF_CONDUCT.md"


[dependency-groups]
docs = [
    "doc8>=1.1.2; python_version >= '3.11'",
    "furo>=2024.8.6; python_version >= '3.11'",
    "readme-renderer[md]>=44.0; python_version >= '3.11'",
    "sphinx>=8.0.0; python_version >= '3.11'",
    "sphinx-autobuild>=2024.10.3; python_version >= '3.11'",
    "sphinx-tabs>=3.4.7; python_version >= '3.11'",
    "sphinxcontrib-django>=2.5; python_version >= '3.11'",
    "sphinxcontrib-typer[pdf,html]>=0.10.0; python_version >= '3.11'",
]
psycopg2      = ["psycopg2>=2.9.10"]
psycopg3      = ["psycopg"]
mysqlclient14 = ["mysqlclient==1.4.3"]
mysqlclient2x = ["mysqlclient>=2.2.0"]
oracledb      = ["oracledb>=2.3.0"]
dj42          = ["Django>=4.2,<5.0"]
dj52          = ["Django>=5.2,<6.0; python_version >= '3.10'"]
dj61          = ["Django>=6.1,<6.2; python_version >= '3.12'"]
typing = [
    "pyright>=1.1.390; python_version >= '3.11'",
    "mypy>=1.19.1; python_version >= '3.11'",
    "django-stubs[compatible-mypy]>=5.1.3; python_version >= '3.11'",
    "django-stubs-ext>=5.1.3; python_version >= '3.11'",
    "types-python-dateutil>=2.8.0; python_version >= '3.11'",
]
lint = [
    "ruff>=0.15.0",
    "readme-renderer[md]>=43.0",
    "doc8>=1.1.2",
    "bandit[toml,sarif]>=1.7.10"
]
coverage  = ["coverage[toml]>=7.6.1"]
test = [
    { include-group = "coverage" },
    "pytest>=8.3.4",
    "pytest-cov>=5.0.0",
    "pytest-django>=4.10.0",
    "playwright>=1.48.0",
    "pytest-playwright>=0.5.2",

]
dev = [
    { include-group = "typing" },
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "lint" },
    "packaging>=24.2",
    "tomlkit>=0.13.3; python_version >= '3.11'",
    "ipdb>=0.13.13; python_version >= '3.11'",
    "ipython>=8.18.1; python_version >= '3.11'",
    "ipykernel; python_version >= '3.11'"  # for zed:
]

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
plugins = ["mypy_django_plugin.main"]
mypy_path = ["src"]
packages = ["django_snapshots"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pyright]
pythonVersion = "3.8"
typeCheckingMode = "basic"
include = ["src/django_snapshots"]
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportDuplicateImport = true

[tool.doc8]
max-line-length = 100
sphinx = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = "test*.py"
norecursedirs = "*.egg .eggs dist build docs .tox .git __pycache__"

markers = [
    "ui: mark test as a UI/browser test requiring Playwright",
    "postgres: mark test as requiring PostgreSQL (set RDBMS=postgres)",
    "mysql: mark test as requiring MySQL or MariaDB (set RDBMS=mysql or RDBMS=mariadb)",
]
addopts = [
    "--strict-markers",
    "--cov=django_snapshots",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
]
filterwarnings = [
    "ignore:In Typer, only the parameter 'autocompletion' is supported.*:DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["django_snapshots"]
concurrency = ["thread", "multiprocessing"]
parallel = true
relative_files = true
command_line = "-m pytest --cov=django_snapshots"

[tool.coverage.paths]
source = ["django_snapshots"]

[tool.ruff]
line-length = 88
exclude = ["doc", "dist"]
target-version = "py38"

[tool.ruff.lint]
exclude = ["tests/**/*"]

[tool.ruff.lint.per-file-ignores]
# Typer reads command signature annotations at runtime. On Python < 3.10 older
# typer releases can't see Annotated metadata in PEP 563 string annotations, so
# these modules must not use `from __future__ import annotations` and must spell
# types as typing.Optional/List/Union.
"src/django_snapshots/management/commands/snapshots.py" = ["FA100", "UP006", "UP007", "UP045"]
"src/django_snapshots/*/management/plugins/snapshots.py" = ["FA100", "UP006", "UP007", "UP045"]
# Django generates migrations with mutable class attributes.
"src/django_snapshots/migrations/*.py" = ["RUF012"]

[tool.bandit]
targets = ["src"]
exclude_dirs = [
    "./tests",
    "./.venv",
    "./doc",
]

skips = [
    "B101",  # assert_used - assertions are fine in tests and Django code
    "B110",  # Try, Except, Pass detected - these are intentional
    "B404",  # import subprocess - required for pg_dump/psql/mysqldump/mysql
    "B603",  # subprocess_without_shell_equals_true - cmd is a list from trusted config, not user input
]
